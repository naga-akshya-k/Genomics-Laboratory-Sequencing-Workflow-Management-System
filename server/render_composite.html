<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide 15 Composite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 24px;
      height: 100%;
    }
    .card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .header {
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      background: #0d9488;
      color: #ffffff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .image-container {
      flex: 1;
      overflow: hidden;
      background: #0f172a;
    }
    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }
  </style>
</head>
<body>
  <div class="grid">
    <!-- Box 1: Login -->
    <div class="card">
      <div class="header">
        <span>1. Authentication &amp; RBAC Portal</span>
        <span class="badge">Login</span>
      </div>
      <div class="image-container">
        <img src="../screenshots/01_login_screen.png" alt="Login">
      </div>
    </div>

    <!-- Box 2: Role-based Dashboard -->
    <div class="card">
      <div class="header">
        <span>2. Clinical Analytics &amp; Throughput Metrics</span>
        <span class="badge">Role-based Dashboard</span>
      </div>
      <div class="image-container">
        <img src="../screenshots/02_role_based_dashboard.png" alt="Role-based Dashboard">
      </div>
    </div>

    <!-- Box 3: Request & Stage Timeline -->
    <div class="card">
      <div class="header">
        <span>3. Specimen Lifecycle &amp; 6-Stage Progress Indicator</span>
        <span class="badge">Request &amp; Stage Timeline</span>
      </div>
      <div class="image-container">
        <img src="../screenshots/04_request_and_stage_timeline.png" alt="Request & Stage Timeline">
      </div>
    </div>

    <!-- Box 4: Report Delivery -->
    <div class="card">
      <div class="header">
        <span>4. Certified Molecular Pathology Report &amp; PDF Release</span>
        <span class="badge">Report Delivery</span>
      </div>
      <div class="image-container">
        <img src="../screenshots/06_report_delivery.png" alt="Report Delivery">
      </div>
    </div>
  </div>
</body>
</html>
